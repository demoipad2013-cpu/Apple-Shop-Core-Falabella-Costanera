/* ===== Tipografía estilo Apple + compacto ===== */
html,body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;letter-spacing:-.006em;font-weight:400}
b,strong{font-weight:600}
.ph h1{font-weight:600;letter-spacing:-.035em;font-size:32px}.ph p{font-weight:400}
.card h3,.ct h3{font-weight:600;letter-spacing:-.018em;font-size:16px}.ct p{font-weight:400}
.hk-v,.kpi .v,.wk-stats b,.vc-v b,.hz-c b,.pmk b,.pgk b,.tm-w b,.cov-big b,.mini b,.mkv,.shl b,.shk b,.acs,.mst,.lvm-c b,.dl b{font-weight:600}
.hk-v{font-weight:500;letter-spacing:-.045em}.wk-stats b{font-weight:500;letter-spacing:-.035em}.hz-c b,.pmk b,.mkv{font-weight:500;letter-spacing:-.03em}
.tn-tabs a{font-weight:500}.tn-tabs a.on{font-weight:600}.btn{font-weight:500}.chip{font-weight:500}.pill{font-weight:600}
th{font-weight:600;letter-spacing:.05em}.eyebrow,.tm-k{font-weight:600}
.ringsvg text:first-of-type{font-weight:500}
/* Resumen más compacto (cabe en una hoja) */
.hk{min-height:170px;padding:18px 20px}.hk-v{font-size:40px;margin-top:6px}
.hk-sp{top:62px}.hk-dual{top:58px;height:56px}.hk-ring{top:52px;width:82px;height:82px}
.wk .wk-stats b{font-size:24px}.wk .gchart{height:190px!important}
.hz-c{padding:12px}.hz-c b{font-size:22px}
.tm-b{padding:12px}.tm-bars{height:90px}
.shd svg{width:104px;height:104px}
/* Metas */
.mkrow{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:14px}
.mkc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 24px rgba(15,23,42,.04)}
.mkh{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut);font-weight:500}.mkh span{width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.mkv{font-size:26px;letter-spacing:-.03em;margin-top:4px}.mks{font-size:11.5px;color:var(--mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mk-c{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--soft);color:var(--mut)}.mk-c.u{background:var(--okb);color:var(--ok)}.mk-c.d{background:var(--badb);color:var(--bad)}
.avc{display:flex;gap:8px;height:150px;align-items:stretch}.avw{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0}
.avn{font-size:10.5px;color:var(--ink2);font-weight:500;height:14px;white-space:nowrap}.avw.on .avn{color:var(--ink);font-weight:700}
.avt{flex:1;width:100%;max-width:44px;position:relative;display:flex;align-items:flex-end}.avt .gb{width:100%;border-radius:8px}.avt em{position:absolute;left:10%;right:10%;border-top:2px solid #94a3b8;opacity:.6}
.avl{font-size:10.5px;color:var(--mut);font-weight:500}.avw.on .avl{color:var(--ink);font-weight:700}
.avy{font-size:10px;font-weight:600;padding:1px 5px;border-radius:6px;color:var(--mut2)}.avy.u{color:var(--ok);background:var(--okb)}.avy.d{color:var(--bad);background:var(--badb)}
.mpod{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mpc{position:relative;display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px;background:linear-gradient(135deg,var(--cb),transparent 60%)}
.mpr{position:absolute;top:8px;right:10px;font-size:22px;font-weight:300;color:var(--c);opacity:.8}.mpc .cic small{display:none}.mpc .cic{width:auto}
.mpx b{display:block;font-size:14px}.mpx small{display:block;font-size:11.5px;color:var(--mut)}
.mgrid{display:grid;grid-template-columns:1fr 180px;gap:16px;align-items:start}.mbars{display:grid;gap:7px}
.mbr{display:grid;grid-template-columns:150px 1fr 70px 70px;gap:10px;align-items:center;font-size:12.5px}.mbn{display:flex;gap:7px;align-items:center;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbt{height:14px;background:var(--track);border-radius:7px;overflow:hidden}.mbt i{display:block;height:100%;border-radius:7px}
.mbv{text-align:right;line-height:1.1}.mbv b{display:block;font-size:13px}.mbv small{font-size:10.5px;color:var(--mut)}.mbs .spark{width:70px}
.mside{display:grid;gap:12px;justify-items:center}.msd{display:flex;flex-direction:column;align-items:center}.msd small{font-size:11px;color:var(--mut)}
.mtot{display:grid;gap:8px;width:100%}.mtot>div{background:var(--soft);border-radius:12px;padding:8px 12px}.mtot small{display:block;font-size:10.5px;color:var(--mut)}.mtot b{font-size:17px;font-weight:600}
@media (max-width:1100px){.mkrow{grid-template-columns:repeat(2,1fr)}.mgrid{grid-template-columns:1fr}.mside{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.mkrow{grid-template-columns:1fr 1fr}.mpod{grid-template-columns:1fr}.mbr{grid-template-columns:110px 1fr 56px}.mbs{display:none}.avc{gap:3px}.avn{display:none}}
.rep .mkrow{grid-template-columns:repeat(5,1fr)!important}.rep .mgrid{grid-template-columns:1fr 180px!important}.rep .mpod{grid-template-columns:repeat(3,1fr)!important}

.gtrack{position:relative}.gv{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;line-height:1.1;white-space:nowrap;pointer-events:none;z-index:2}
.gv b{font-size:11px;font-weight:600;color:var(--ink2);letter-spacing:-.01em}.gcol.on .gv b{font-size:13px;color:var(--ink)}
.gv em{font-style:normal;font-size:9.5px;font-weight:600;padding:0 4px;border-radius:5px;margin-top:2px}.gv em.u{color:var(--ok);background:var(--okb)}.gv em.d{color:var(--bad);background:var(--badb)}
.gcol.on .gtip{display:none}
@media (max-width:760px){.gv b{font-size:8.5px}.gv em{display:none}}

.gcards{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.gcd{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;background:linear-gradient(180deg,var(--card),var(--soft))}

.gcd-v b{font-size:24px;font-weight:500;letter-spacing:-.03em}.gcd-v small{font-size:11.5px;color:var(--mut);margin-left:4px}
.gcd-f{font-size:11.5px;color:var(--mut)}

 if(!g)return;
 if(full){g.from(R.querySelectorAll('.ph > *, .pbar, main .card, main .vcard, main .grid > section'),{y:18,opacity:0,duration:.6,stagger:.035,ease:'power3.out',clearProps:'all'})}
 if(full||soft){g.from(R.querySelectorAll('.gb'),{scaleY:0,transformOrigin:'50% 100%',duration:soft?.5:.9,stagger:.035,ease:'power3.out',clearProps:'transform'});
  g.from(R.querySelectorAll('.wb .tr i'),{scaleY:0,transformOrigin:'50% 100%',duration:soft?.45:.8,stagger:.03,ease:'power3.out',clearProps:'transform'});

  g.from(R.querySelectorAll('.hb .t i, .prog i, .cov i'),{scaleX:0,transformOrigin:'0 50%',duration:.8,stagger:.02,ease:'power3.out',clearProps:'transform'})}
 const nt=R.querySelector('.tn-tabs'),na=R.querySelector('.tn-tabs a.on');if(nt&&na){const l=na.offsetLeft-nt.offsetLeft;if(l<nt.scrollLeft||l+na.offsetWidth>nt.scrollLeft+nt.clientWidth)nt.scrollLeft=l-nt.clientWidth/2+na.offsetWidth/2}}

function startCarousel(car){clearInterval(CAR_T);const sl=[...car.querySelectorAll('.slide')];if(sl.length<2)return;let i=UI.carI||0;const show=k=>{i=(k+sl.length)%sl.length;UI.carI=i;sl.forEach((s,j)=>s.classList.toggle('on',j===i));car.querySelectorAll('.cdots i').forEach((d,j)=>d.classList.toggle('on',j===i));if(window.gsap)gsap.fromTo(sl[i],{opacity:0,x:24},{opacity:1,x:0,duration:.5,ease:'power2.out'})};show(i);car.querySelectorAll('.cdots i').forEach((d,j)=>d.onclick=()=>{show(j);restart()});const nx=car.querySelector('[data-car=n]'),pv=car.querySelector('[data-car=p]');if(nx)nx.onclick=()=>{show(i+1);restart()};if(pv)pv.onclick=()=>{show(i-1);restart()};const restart=()=>{clearInterval(CAR_T);CAR_T=setInterval(()=>{if(!document.body.contains(car))return clearInterval(CAR_T);show(i+1)},6500)};restart()}

function spark(vals,col,{h=46,w=130}={}){const vs=vals.map(v=>v==null?null:+v);const ok=vs.filter(v=>v!=null);if(ok.length<2)return `<svg class="spark" width="${w}" height="${h}"></svg>`;const mx=Math.max(...ok),mn=Math.min(...ok);const X=i=>4+i*(w-8)/(vs.length-1),Y=v=>h-6-(v-mn)/((mx-mn)||1)*(h-14);let d='',last=null;vs.forEach((v,i)=>{if(v==null)return;d+=(d?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);last=[X(i),Y(v)]});const id='g'+Math.random().toString(36).slice(2,7);const first=vs.findIndex(v=>v!=null);return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${last[0]} ${h}L${X(first)} ${h}Z" fill="url(#${id})"/><path class="ln" d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${col}"/><circle cx="${last[0]}" cy="${last[1]}" r="7" fill="${col}" opacity=".18" class="pulse"/></svg>`}
function vcard(icn,col,bg,val,unit,label,sp,count){return `<div class="vcard"><div class="vc-i" style="background:${bg};color:${col}">${ic(icn,17)}</div><div class="vc-t"><div class="vc-v"><b ${count||''}>${val}</b><span>${unit}</span></div><div class="vc-l">${label}</div></div>${spark(sp,col,{w:92,h:42})}</div>`}
function ring(parts,score,sub){const R0=78,gap=15,sw=11;let svg='';parts.forEach((p,i)=>{const r=R0-i*gap;const c=2*Math.PI*r;const len=Math.max(0,Math.min(1,p.v||0))*c;svg+=`<circle r="${r}" cx="100" cy="100" fill="none" stroke="${p.c}" stroke-opacity=".14" stroke-width="${sw}"/><circle class="ring-a" data-len="${len}" data-tot="${c}" r="${r}" cx="100" cy="100" fill="none" stroke="${p.c}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${len} ${c}" transform="rotate(-90 100 100)"/>`});return `<svg width="200" height="200" viewBox="0 0 200 200" class="ringsvg">${svg}<text x="100" y="104" text-anchor="middle" font-size="34" font-weight="800" fill="currentColor" data-count="${score}">${score}</text><text x="100" y="124" text-anchor="middle" font-size="11" fill="#94a3b8">${sub}</text></svg>`}
function covScore(){const inv=invWeek();if(!inv)return 0;const cs=['iPhone','Mac','iPad','Watch','AirPods'];let ok=0;cs.forEach(c=>{const st=sum(inv.rows.filter(r=>r.cat===c).map(r=>Math.max(0,+r.stock||0)));const sg=catSug(c);if(sg&&st/sg>=1)ok++});return ok/cs.length}

/* ================= ESTACIONALIDAD ================= */
function evWeeks(e){const s=new Date(e.start+'T12:00:00'),en=new Date(e.end+'T12:00:00');const out=[];for(let q=1;q<=4;q++)for(let w=1;w<=13;w++){const a=wStart(UI.fy,q,w),b=new Date(a.getTime()+7*864e5);if(s<b&&en>=a)out.push([q,w])}return out}
function nextEvent(){const ref=new Date(new Date().toDateString());return S.events.filter(e=>new Date(e.end+'T23:00:00')>=ref).sort((a,b)=>a.start.localeCompare(b.start))[0]}
function vEst(){
 const f=S.events.filter(e=>(!UI.evQ||e.cq===UI.evQ)&&(UI.evImp==='Todos'||e.impact===UI.evImp)&&(UI.evLine==='Todas'||e.lines.toLowerCase().includes(UI.evLine.toLowerCase())||(UI.evLine==='Mac'&&/macbook/i.test(e.lines))));
 const f2=UI.evOnly&&UI.w?f.filter(e=>evWeeks(e).some(([q,w])=>q===UI.q&&w===UI.w)):f;
 const cell={};f.forEach(e=>evWeeks(e).forEach(([q,w])=>{const k=q+'-'+w;cell[k]=cell[k]||[];cell[k].push(e)}));
 const rank=i=>({'Muy alto':3,'Alto':2,'Medio':1}[i]||0);
 const nx=nextEvent();
 const qn=['','Oct–Dic','Ene–Mar','Abr–Jun','Jul–Sep'];
 return `<div class="grid g4">${kpi('cal','#e8eefc','#2f5bd3','Eventos FY'+UI.fy,S.events.length,'Mapa comercial Apple Chile')}${kpi('flag','#fdecec','#dc2626','Impacto muy alto',S.events.filter(e=>e.impact==='Muy alto').length,'Campañas prioritarias')}${kpi('pulse','#fdf3e2','#d97706','Próxima ventana',nx?esc(nx.name):'—',nx?esc(nx.label):'')}${kpi('list','#e8f7ee','#16a34a','Eventos en vista',f2.length,'Según los filtros aplicados')}</div>
 <section class="card" style="margin-top:14px"><div class="ct"><div><h3>Mapa anual FY${UI.fy}</h3><p>Cruza las fechas con las 52 semanas fiscales. El color muestra el mayor impacto de la semana.</p></div><button class="btn sm pri" data-act="addEv">${ic('plus',14)}Agregar evento</button></div>
 <div class="row" style="margin-bottom:14px"><select class="s" data-chg="evQ"><option value="0">Todo FY${UI.fy}</option>${[1,2,3,4].map(q=>`<option value="${q}" ${UI.evQ===q?'selected':''}>Q${q} · ${qn[q]}</option>`).join('')}</select><select class="s" data-chg="evImp">${['Todos','Muy alto','Alto','Medio'].map(x=>`<option ${UI.evImp===x?'selected':''}>${x}</option>`).join('')}</select><select class="s" data-chg="evLine"><option>Todas</option>${LINES.map(x=>`<option ${UI.evLine===x?'selected':''}>${x}</option>`).join('')}</select><label class="row" style="gap:6px;font-weight:600;font-size:13px"><input type="checkbox" data-chg="evOnly" ${UI.evOnly?'checked':''}> Solo semana seleccionada</label></div>
 <div class="tbl"><div class="heat" style="min-width:760px">${[1,2,3,4].map(q=>`<div class="hl">Q${q}<small>${qn[q]}</small></div>`+[...Array(13)].map((_,i)=>{const w=i+1;const es=cell[q+'-'+w]||[];const mx=Math.max(0,...es.map(e=>rank(e.impact)));const col=mx===3?'#fde2e2':mx===2?'#fdefd6':mx===1?'#e3eafc':'';const tc=mx===3?'#b91c1c':mx===2?'#b45309':mx===1?'#2f5bd3':'';return `<div class="hc ${UI.q===q&&UI.w===w?'on':''}" style="${col?`background:${col};color:${tc}`:''}" data-act="setqw" data-v="${q}-${w}" title="${es.map(e=>e.name).join(', ')}"><small>W${p2(w)}</small>${es.length||'·'}</div>`}).join('')).join('')}</div></div>
 <div class="legend"><span><i class="sw" style="background:#fde2e2"></i>Muy alto</span><span><i class="sw" style="background:#fdefd6"></i>Alto</span><span><i class="sw" style="background:#e3eafc"></i>Medio</span></div></section>
 <div class="grid g2">${[1,2,3,4].filter(q=>!UI.evQ||UI.evQ===q).map(q=>{const es=f2.filter(e=>e.cq===q).sort((a,b)=>a.start.localeCompare(b.start));return `<section class="card"><div class="ct"><div><h3>Q${q} · ${qn[q]}</h3><p>${es.length} eventos</p></div></div>${es.map(e=>`<div class="ev"><div class="d">${esc(e.label)}</div><div><b>${esc(e.name)}</b><span>${esc(e.lines)}</span></div><div class="row" style="gap:6px"><span class="pill ${e.impact==='Muy alto'?'bad':e.impact==='Alto'?'wa':'ac'}">${e.impact}</span><a data-act="del" data-c="events" data-v="${e.id}" style="color:var(--mut2);cursor:pointer" title="Eliminar">${ic('x',14)}</a></div></div>`).join('')||'<div class="empty">Sin eventos con estos filtros.</div>'}</section>`}).join('')}</div>`}

/* ================= PLANOGRAMA ================= */
function pgFill(pg){if(pg)Object.keys(POS).forEach(p=>{if(!pg[p]){const h=POS[p][6]&&pg[POS[p][6]];pg[p]={status:h?h.status:'No verificado',reason:'',note:'',action:'',owner:''}}});return pg}
function pgGet(q=UI.q){const k=UI.fy+'-'+q;pgFill(S.planogram[k]);if(!S.planogram[k]){if(q===UI.q&&!S.planogram[k]){}return Object.fromEntries(Object.keys(POS).map(p=>[p,{status:'No verificado',reason:'',note:'',action:'',owner:''}]))}return S.planogram[k]}
function pgEnsure(){const k=UI.fy+'-'+UI.q;if(!S.planogram[k]){const prev=S.planogram[UI.fy+'-'+(UI.q-1)];S.planogram[k]=Object.fromEntries(Object.keys(POS).map(p=>[p,{status:'No verificado',reason:'',note:prev&&prev[p]&&prev[p].status!=='Exhibido'?'Pendiente en Q'+(UI.q-1):'',action:'',owner:''}]))}return S.planogram[k]}
function pgStats(pg){const v=Object.values(pg);const ex=v.filter(p=>p.status==='Exhibido').length,nv=v.filter(p=>p.status==='No verificado').length,pr=v.filter(p=>p.status==='Pendiente'||p.status==='Incidencia').length;return {tot:v.length,ex,nv,pr,cov:(v.length-nv)/v.length,cum:ex/v.length}}
function pgStockTab(pg){const inv=invWeek();const eq=[...REAR,...FRONT].filter(p=>POS[p][2]==='eq');const rows=eq.map(p=>{const st=pgStock(p);return {p,st,adv:pgAdvice(p,st,pg[p].status)}});const can=rows.filter(r=>r.adv.c==='ok'&&pg[r.p].status!=='Exhibido').length,no=rows.filter(r=>r.adv.c==='bad').length,exNo=rows.filter(r=>pg[r.p].status==='Exhibido'&&r.st&&r.st.model===0).length;
 if(!inv)return `<section class="card" style="margin-top:14px"><div class="empty">${ic('box')} Carga el inventario de Cascade (Inv Rptd) para cruzarlo con el planograma.</div></section>`;
 return `<div class="grid g3"><div class="card kpi"><div class="h"><div class="ic" style="background:#e8f7ee;color:#16a34a">${ic('check',17)}</div>Se pueden exhibir ya</div><div class="v">${can}</div><div class="s">Pendientes con stock del color del planograma</div></div><div class="card kpi"><div class="h"><div class="ic" style="background:#fdecec;color:#dc2626">${ic('box',17)}</div>Sin stock para exhibir</div><div class="v">${no}</div><div class="s">Pedir reposición o el color a Apple</div></div><div class="card kpi"><div class="h"><div class="ic" style="background:#fdf3e2;color:#d97706">${ic('alert',17)}</div>Exhibidos sin stock</div><div class="v">${exNo}</div><div class="s">En la mesa pero sin unidades para vender</div></div></div>
 <section class="card" style="margin-top:14px"><div class="ct"><div><h3>Stock del inventario vs planograma</h3><p>Inventario Cascade W${p2(inv.w)} · ${esc(inv.ref)} · el color es el del equipo que pide el planograma 10/26</p></div><button class="btn sm" data-act="pgAutoReason">${ic('edit',14)}Aplicar motivos sugeridos</button></div>
 <div class="tbl"><table><thead><tr><th>Pos.</th><th>Producto del planograma</th><th>Estado</th><th class="r">Stock color</th><th class="r">Stock modelo</th><th>SKU que coinciden</th><th>Sugerencia</th></tr></thead><tbody>${rows.map(({p,st,adv})=>`<tr data-act="pgOpen" data-v="${p}" style="cursor:pointer"><td><b>${pgLabel(p)}</b></td><td><b>${esc(POS[p][0])}</b><div class="muted" style="font-size:11.5px">${esc(POS[p][3])}</div></td><td>${stPill(pg[p].status)}</td><td class="r bold">${st?nf(st.color):'—'}</td><td class="r">${st?nf(st.model):'—'}</td><td style="font-size:11.5px;max-width:260px">${st&&st.skus.length?st.skus.filter(s=>s.ppn||s.stock>0).slice(0,3).map(s=>`<div title="${esc(s.ppn?'PPN '+s.ppn:'')}">${esc(skuLabel(s))} · <b>${nf(s.stock)}</b></div>`).join(''):'<span class="muted">—</span>'}</td><td><span class="pill ${adv.c}">${esc(adv.t)}</span></td></tr>`).join('')}</tbody></table></div><p class="note">Coincidencia por modelo exacto y color (por ejemplo, iPhone 18 Pro Max Burgundy “BRGY”). Las señaléticas no usan stock. “Aplicar motivos sugeridos” completa el motivo “Sin stock” en las posiciones pendientes sin unidades del color.</p></section>`}
function pgUpd(){return S.pgUpd&&S.pgUpd[UI.fy+'-'+UI.q]||[]}
function pgLabel(p){const r=REAR.indexOf(p);return r>=0?'P'+p2(r+1):'F'+p2(FRONT.indexOf(p)+1)}
const tagPill=t=>t?`<span class="pill ${t==='NEW'?'ok':t==='MOVE'?'wa':'bad'}" style="font-size:10.5px;padding:2px 7px">${t}</span>`:'';
function vPg(){
 const pg=pgGet();const st=pgStats(pg);const IMG=window.ASC_IMG||{};
 const match=p=>{const[n,c,t]=POS[p];const s=pg[p].status;return (UI.pgCat==='Todas'||c===UI.pgCat)&&(UI.pgType==='Todos'||(UI.pgType==='Equipos'?t==='eq':t==='sg'))&&(UI.pgSt==='Todos'||s===UI.pgSt)};
 const pend=Object.entries(pg).filter(([p,v])=>v.status==='Pendiente'||v.status==='Incidencia');
 const upd=pgUpd();const tab=UI.pgTab;
 const catS=PGCATS.map(c=>{const ps=Object.keys(POS).filter(p=>POS[p][1]===c);const ex=ps.filter(p=>pg[p].status==='Exhibido').length;return {c,ex,t:ps.length}});
 const filters=`<div class="row" style="margin-bottom:12px"><select class="s" data-chg="pgCat"><option>Todas</option>${PGCATS.map(c=>`<option ${UI.pgCat===c?'selected':''}>${c}</option>`).join('')}</select><select class="s" data-chg="pgType">${['Todos','Equipos','Señalética y gráficas'].map(c=>`<option ${UI.pgType===c?'selected':''}>${c}</option>`).join('')}</select><select class="s" data-chg="pgSt"><option>Todos</option>${PSTAT.map(c=>`<option ${UI.pgSt===c?'selected':''}>${c}</option>`).join('')}</select><div class="legend" style="margin:0">${PSTAT.map(s=>`<span><i class="sw st-${s.split(' ')[0]}"></i>${s}</span>`).join('')}<span>${tagPill('NEW')} nuevo</span><span>${tagPill('MOVE')} se mueve</span></div></div>`;
 const mk=(p,side)=>{const s=pg[p].status;const stk=pgStock(p);const adv=pgAdvice(p,stk,s);return `<button class="mk ${match(p)?'':'dim'} ${stk&&POS[p][2]==='eq'?(adv.c==='bad'?'nostk':adv.c==='ok'&&s!=='Exhibido'?'canex':''):''}" style="left:${POS[p][5]}%;top:${side==='r'?26:79}%" data-act="pgOpen" data-v="${p}" title="${esc(POS[p][0])} · ${s}${stk?` · stock color ${stk.color} / modelo ${stk.model}`:''}"><i class="st-${s.split(' ')[0]}"></i>${pgLabel(p)}${stk&&POS[p][2]==='eq'?`<u>${stk.color}</u>`:''}${POS[p][4]?`<em class="${POS[p][4]==='NEW'?'n':'m'}">${POS[p][4]}</em>`:''}</button>`};
 const gfx=(p,src,lbl)=>`<div class="gfx ${match(p)?'':'dim'}" data-act="pgOpen" data-v="${p}"><div class="gfx-h"><b>${lbl}</b>${stPill(pg[p].status)}${tagPill('NEW')}</div>${src?`<img src="${src}" alt="">`:''}</div>`;
 const card=p=>{const[n,c,t,d,tg]=POS[p];const s=pg[p].status;return `<div class="pcard ${match(p)?'':'dim'}" data-act="pgOpen" data-v="${p}"><div class="pc-h"><span class="pc-n"><i class="sw st-${s.split(' ')[0]}" style="border-radius:9px"></i>${pgLabel(p)}</span>${tagPill(tg)}</div><b>${esc(n)}</b><span>${esc(d)}</span><div class="pc-f">${stPill(s)}<span class="muted">${t==='eq'?'Equipo':'Señalética'}</span></div>${pg[p].reason?`<span class="muted" style="font-size:11.5px">Motivo: ${esc(pg[p].reason)}</span>`:''}</div>`};
 return `<div class="grid g4">${kpi('table','#e8eefc','#2f5bd3','Elementos a verificar',st.tot,'Productos, teclados, Apple Pencil y gráficas · sin price tickets')}${kpi('target','#e8f7ee','#16a34a','Cumplimiento',pc(st.cum,1),`${st.ex} exhibidas de ${st.tot}`,st.cum)}${kpi('check','#f1eafe','#7c3aed','Actualización 10/26',`${upd.length}/${PGUPD.length}`,'Cambios NEW · MOVE · REMOVE aplicados',upd.length/PGUPD.length)}${kpi('alert','#fdf3e2','#d97706','Por resolver',st.pr,`Pendientes e incidencias · cobertura ${pc(st.cov,0)}`)}</div>
 <div class="tabs">${[['mesa','Vista superior'],['stock','Stock vs planograma'],['pos','Posiciones'],['verif','Verificación'],['pend','Pendientes · '+pend.length],['upd','Actualización 10/26'],['trim','Trimestres']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="pgTab" data-v="${k}">${l}</button>`).join('')}</div>
 ${tab==='mesa'?`<section class="card" style="margin-top:14px"><div class="ct"><div><h3>Apple Shop Core · Graphic Table 5,00 m · L · Solid Base</h3><p>Planograma Chile 10/26 · Desktops + Laptops + iPad (x4) + iPhone + Watch + HomePod mini · FY${UI.fy} Q${UI.q}. Toca un punto para abrir su ficha.</p></div><button class="btn dark" data-act="pgVerify">${ic('check',16)}Verificar exhibiciones</button></div>${filters}
 <div class="pgv"><div class="pgv-in">${gfx('rear-graphic',IMG.gr,'BACK · GPF95 · MacBook Pro PROLED XDR + Watch S12')}
 <div class="side-lbl" style="margin-top:12px"><span>Lado posterior · Watch / HomePod / Mac</span><span class="muted">P01–P16</span></div>
 <div class="pgimg">${IMG.table?`<img src="${IMG.table}" alt="Vista superior Graphic Table 5,00 m">`:'<div class="mid" style="height:260px">GRAPHIC TABLE 5,00 M</div>'}${REAR.slice(0,16).map(p=>mk(p,'r')).join('')}${FRONT.slice(0,16).map(p=>mk(p,'f')).join('')}</div>
 <div class="side-lbl" style="margin-top:6px"><span>Lado frontal · iPhone / AirPods / iPad</span><span class="muted">F01–F16 · ▲ Primary Product Presentation</span></div>
 ${gfx('front-graphic',IMG.gf,'FRONT · GPF95 · iPhone 18 Pro Burgundy + iPhone Duo')}</div></div>
 <p class="note">Las gráficas y letreros son referenciales; la ubicación puede variar por tienda según el layout.</p></section>
 <div class="grid g2"><section class="card"><div class="ct"><div><h3>Estado por categoría</h3><p>Equipos y señalética del trimestre.</p></div><button class="btn sm" data-act="pgTab" data-v="pend">Ver pendientes · ${pend.length}</button></div>${catS.map(c=>`<div class="hb" style="grid-template-columns:86px 1fr 100px"><div class="n"><i class="sw" style="background:${LCOL[c.c]||'#64748b'}"></i>${c.c}</div><div class="t"><i style="width:${c.ex/c.t*100}%;background:${c.ex===c.t?'#16a34a':'#f59e0b'}"></i></div><div class="x">${c.ex} / ${c.t} <span class="muted" style="font-weight:500">exhib.</span></div></div>`).join('')}</section>
 <section class="card"><div class="ct"><div><h3>Por resolver</h3><p>${pend.length} posiciones pendientes o con incidencia.</p></div></div>${pend.slice(0,6).map(([p,v])=>`<div class="it" data-act="pgOpen" data-v="${p}" style="cursor:pointer"><b>${pgLabel(p)} · ${esc(POS[p][0])}</b><div class="m">${stPill(v.status)}${tagPill(POS[p][4])}${esc(v.reason||'Sin motivo registrado')}</div></div>`).join('')||`<div class="empty">${ic('check')} Todo exhibido.</div>`}${pend.length>6?`<button class="btn sm" data-act="pgTab" data-v="pend">Ver los ${pend.length}</button>`:''}</section></div>`:''}
 ${tab==='stock'?pgStockTab(pg):''}
 ${tab==='pos'?`<section class="card" style="margin-top:14px"><div class="ct"><div><h3>Posiciones de la mesa</h3><p>Orden real del planograma, de izquierda a derecha.</p></div></div>${filters}<div class="side-lbl"><span>Lado posterior · Watch / HomePod / Mac</span></div><div class="pgrid">${REAR.map(card).join('')}</div><div class="side-lbl" style="margin-top:16px"><span>Lado frontal · iPhone / AirPods / iPad</span></div><div class="pgrid">${FRONT.map(card).join('')}</div></section>`:''}

function readWorkbook(wb){const ctx={n:0,weeks:new Set(),changes:[],sheets:[],unknown:[],cascade:false};const S0=JSON.stringify(S);
 try{const c=parseCascade(wb);if(c&&(Object.keys(c.tot).length||Object.keys(c.inv).length)){ctx.cascade=true;applyCascade(c,ctx);ctx.sheets.push(`Apple Cascade (${ctx.tf})`)}
  const shm=parseShareMatrix(wb);if(shm.length)applyShareMatrix(shm,ctx);
  wb.SheetNames.forEach(sn=>{if((ctx.shareSheets||[]).includes(sn))return;const {head,rows}=sheetRows(wb.Sheets[sn]);if(!rows.length)return;if(head.includes('lob')&&head.includes('measure'))return;if(/filter_info|filtro|leeme|léeme|readme/i.test(norm(sn)))return;const byName=Object.entries(SHEETS).find(([k,s])=>norm(s.name)===norm(sn));const sp=byName||Object.entries(SHEETS).find(([k,s])=>s.detect(head));if(!sp){ctx.unknown.push(sn);return}const before=ctx.n;sp[1].imp(rows,ctx);ctx.sheets.push(`${sp[1].name}: ${ctx.n-before} filas`)})}catch(err){S=JSON.parse(S0);throw err}
 return ctx}
